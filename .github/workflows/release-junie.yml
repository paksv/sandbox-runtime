name: Release (JetBrains)

# Builds the standalone `srt` binaries JetBrains Junie bundles and publishes them as GitHub
# Release assets. Separate from release.yml on purpose: that workflow npm-publishes
# @anthropic-ai/sandbox-runtime with upstream's credentials, and keeping it byte-identical to
# upstream keeps rebases mechanical. See docs/jetbrains-build.md.

on:
  push:
    tags: ['jb-v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # Same system dependencies integration-tests.yml installs on its macOS lane; srt shells out to rg.
      - run: brew install ripgrep zsh

      - run: npm ci

      - run: npm run build

      - run: npm test

  build:
    name: Build (${{ matrix.os }}-${{ matrix.arch }})
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            os: darwin
            runner: macos-14
            target: bun-darwin-arm64
          # macos-15-intel is the last x86-64 image Actions offers (until August 2027);
          # macos-13 was retired on 2025-12-04. Each arch is built on its own native host so
          # the smoke test below can actually execute the binary it just produced.
          - arch: x64
            os: darwin
            runner: macos-15-intel
            target: bun-darwin-x64
          - arch: x64
            os: linux
            runner: ubuntu-24.04
            target: bun-linux-x64-baseline
          - arch: arm64
            os: linux
            runner: ubuntu-24.04-arm
            target: bun-linux-arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - if: matrix.os == 'darwin'
        run: brew install ripgrep

      - if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap socat ripgrep build-essential libseccomp-dev python3 apparmor-utils
          uname -a
          getconf GNU_LIBC_VERSION
          lscpu

      - name: Allow namespaces for this smoke-test process
        if: matrix.os == 'linux'
        run: |
          sudo apparmor_parser -r <<'EOF'
          profile junie-srt-ci flags=(unconfined) {
            userns,
          }
          EOF

      - run: npm ci

      - name: Resolve version
        id: version
        run: echo "version=$(tr -d '[:space:]' < JB_VERSION)" >> "$GITHUB_OUTPUT"

      - name: Build single-file executable
        env:
          ASSET: srt-${{ steps.version.outputs.version }}-${{ matrix.os }}-${{ matrix.arch }}
        run: |
          bun build --compile --target=${{ matrix.target }} src/cli.ts --outfile "$ASSET"
          file "$ASSET"
          ls -l "$ASSET"

      - name: Build native helper
        if: matrix.os == 'linux'
        env:
          HELPER: apply-seccomp-${{ steps.version.outputs.version }}-linux-${{ matrix.arch }}
        run: |
          npm run build:seccomp
          cp "vendor/seccomp/${{ matrix.arch }}/apply-seccomp" "$HELPER"
          file "$HELPER"
          {
            printf '\nLinux %s apply-seccomp static dependencies\n' '${{ matrix.arch }}'
            dpkg-query -W libc6-dev libgcc-13-dev
            printf '\nSource: https://launchpad.net/ubuntu/+source/glibc\n'
            printf 'Source: https://launchpad.net/ubuntu/+source/gcc-13\n'
            cat /usr/share/doc/libc6/copyright /usr/share/doc/gcc-13-base/copyright
            cat /usr/share/common-licenses/LGPL-2.1 /usr/share/common-licenses/GPL-3
          } > "THIRD-PARTY-linux-${{ matrix.arch }}"

      - name: Linux unit tests
        if: matrix.os == 'linux'
        run: |
          npm run build
          bun test test/sandbox/seccomp-filter.test.ts test/sandbox/seccomp-fail-closed.test.ts test/sandbox/linux-dependency-error.test.ts

      - name: Smoke test
        env:
          ASSET: srt-${{ steps.version.outputs.version }}-${{ matrix.os }}-${{ matrix.arch }}
          HELPER: apply-seccomp-${{ steps.version.outputs.version }}-linux-${{ matrix.arch }}
        run: |
          if [ "${{ matrix.os }}" = linux ]; then
            aa-exec -p junie-srt-ci -- ./scripts/smoke-test-srt.sh "./$ASSET" "./$HELPER"
          else
            ./scripts/smoke-test-srt.sh "./$ASSET"
          fi

      - name: Checksum
        env:
          ASSET: srt-${{ steps.version.outputs.version }}-${{ matrix.os }}-${{ matrix.arch }}
          HELPER: apply-seccomp-${{ steps.version.outputs.version }}-linux-${{ matrix.arch }}
        run: |
          shasum -a 256 "$ASSET" | tee "$ASSET.sha256"
          if [ "${{ matrix.os }}" = linux ]; then
            shasum -a 256 "$HELPER" | tee "$HELPER.sha256"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: srt-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            srt-${{ steps.version.outputs.version }}-${{ matrix.os }}-${{ matrix.arch }}*
            apply-seccomp-${{ steps.version.outputs.version }}-linux-${{ matrix.arch }}*
            THIRD-PARTY-linux-${{ matrix.arch }}
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/jb-v')
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verify the tag matches JB_VERSION
        run: |
          version="$(tr -d '[:space:]' < JB_VERSION)"
          tag="${GITHUB_REF#refs/tags/}"
          if [ "$tag" != "jb-v${version}" ]; then
            echo "Tag $tag does not match JB_VERSION ($version): expected jb-v${version}"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          pattern: srt-*
          merge-multiple: true

      - name: Assemble third-party notices
        run: |
          npm ci --ignore-scripts
          ./scripts/collect-third-party-licenses.sh
          cat THIRD-PARTY-linux-x64 THIRD-PARTY-linux-arm64 >> THIRD-PARTY

      - name: Verify checksums
        run: |
          for f in *.sha256; do
            shasum -a 256 -c "$f"
          done

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "jb-v${version}" \
            --title "srt ${version} (JetBrains build)" \
            --notes "Standalone macOS and Linux builds of srt ${version} for JetBrains Junie. Linux requires system bubblewrap, socat and ripgrep. Install the matching Linux helper beside srt as apply-seccomp. Consumers must verify the .sha256 assets. See MODIFICATIONS and docs/jetbrains-build.md for scope, baseline and licensing." \
            "srt-${version}-darwin-arm64" \
            "srt-${version}-darwin-arm64.sha256" \
            "srt-${version}-darwin-x64" \
            "srt-${version}-darwin-x64.sha256" \
            "srt-${version}-linux-arm64" \
            "srt-${version}-linux-arm64.sha256" \
            "srt-${version}-linux-x64" \
            "srt-${version}-linux-x64.sha256" \
            "apply-seccomp-${version}-linux-arm64" \
            "apply-seccomp-${version}-linux-arm64.sha256" \
            "apply-seccomp-${version}-linux-x64" \
            "apply-seccomp-${version}-linux-x64.sha256" \
            LICENSE \
            MODIFICATIONS \
            THIRD-PARTY
